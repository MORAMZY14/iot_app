name: Build APK & IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  # ---------------------------
  # 1. Update version and tag
  # ---------------------------
  update-version:
    name: Auto-increment version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_tag: ${{ steps.bump.outputs.new_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read current version from main.dart
        id: read_version
        shell: bash
        run: |
          VERSION=$(grep -oP "const String appVersion = '\K[^']+" lib/main.dart || true)

          if [ -z "$VERSION" ]; then
            echo "Could not find appVersion in lib/main.dart"
            exit 1
          fi

          echo "current_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          VERSION="${{ steps.read_version.outputs.current_version }}"
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/^[Vv]//')

          if [[ ! "$CLEAN_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid version format: $VERSION"
            echo "Expected format: V2.0.0"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          PATCH=$((PATCH + 1))

          NEW_VERSION="V${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="$NEW_VERSION"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Update lib/main.dart
        shell: bash
        run: |
          sed -i "s/const String appVersion = '.*';/const String appVersion = '${{ steps.bump.outputs.new_version }}';/" lib/main.dart

      - name: Update pubspec.yaml
        shell: bash
        run: |
          CLEAN_VERSION=$(echo "${{ steps.bump.outputs.new_version }}" | sed 's/^[Vv]//')

          if ! grep -q '^version:' pubspec.yaml; then
            echo "No version field found in pubspec.yaml"
            exit 1
          fi

          sed -i "s/^version:.*/version: ${CLEAN_VERSION}+${{ github.run_number }}/" pubspec.yaml
          echo "Updated pubspec.yaml to ${CLEAN_VERSION}+${{ github.run_number }}"

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add lib/main.dart pubspec.yaml

          if git diff --cached --quiet; then
            echo "No version change to commit"
          else
            git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
            git push
          fi

      - name: Create and push tag
        shell: bash
        run: |
          TAG="${{ steps.bump.outputs.new_tag }}"
          git fetch --tags

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists locally"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin"
            exit 1
          fi

          git tag "$TAG"
          git push origin "$TAG"

  # ---------------------------
  # 2. Build Android APK
  # ---------------------------
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: update-version

    steps:
      - name: Checkout new tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-version.outputs.new_tag }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get Flutter packages
        run: |
          flutter clean
          flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------
  # 3. Build unsigned iOS IPA
  # ---------------------------
  build-ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    needs: update-version

    steps:
      - name: Checkout new tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update-version.outputs.new_tag }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: Show Flutter and Xcode versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Disable Flutter Swift Package Manager integration
        run: flutter config --no-enable-swift-package-manager

      - name: Clean project and get Flutter packages
        run: |
          flutter clean
          flutter pub get

      - name: Create and validate GoogleService-Info.plist
        shell: bash
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "The GOOGLE_SERVICE_INFO_PLIST secret is empty or missing"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: Verify Podfile uses iOS 15
        shell: bash
        run: |
          echo "Podfile header:"
          sed -n '1,8p' ios/Podfile

          if ! grep -Eq "^platform[[:space:]]+:ios,[[:space:]]*['\"]15\.0['\"]" ios/Podfile; then
            echo "ios/Podfile must contain: platform :ios, '15.0'"
            exit 1
          fi

      - name: Install CocoaPods dependencies
        shell: bash
        working-directory: ios
        run: |
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        working-directory: build/ios/iphoneos
        run: |
          if [ ! -d Runner.app ]; then
            echo "Runner.app was not generated"
            exit 1
          fi

          mkdir Payload
          cp -R Runner.app Payload/Runner.app
          zip -qry iot.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/iot.ipa
          if-no-files-found: error
          retention-days: 7

  # ---------------------------
  # 4. Publish one GitHub Release
  # ---------------------------
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - update-version
      - build-apk
      - build-ios

    steps:
      - name: Download APK and IPA artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          path: release-files
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          test -f release-files/app-release.apk
          test -f release-files/iot.ipa
          ls -lh release-files/app-release.apk release-files/iot.ipa

      - name: Create GitHub Release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.update-version.outputs.new_tag }}
          name: ${{ needs.update-version.outputs.new_version }}
          body: "Version ${{ needs.update-version.outputs.new_version }} - Android APK and unsigned iOS IPA"
          files: |
            release-files/app-release.apk
            release-files/iot.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
